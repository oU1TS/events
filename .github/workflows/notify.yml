name: Event Notification & Alerting Pipeline

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'raids.json'
      - 'events/raids.json'
  schedule:
    # Trigger daily at 06:00 AM UTC (12:00 PM BST) to scan for deadlines
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dispatch-notifications:
    name: Dispatch Alerts & Sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Sync Git raids.json to Supabase Database
        if: github.event_name == 'push'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://bennnocwssmcpiqradvc.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJlbm5ub2N3c3NtY3BpcXJhZHZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3Mjk0MjAsImV4cCI6MjEwNTMwNTQyMH0.fOi4e7zdQDkPGA94a9__MgN_Q4u57Pj4-fBl4zz56Bc' }}
        run: |
          node .github/scripts/sync-git-to-supabase.js

      - name: Dispatch Push Notification
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          PLATFORM_BASE_URL: 'https://ou1ts.github.io/events/' # Customize to your production domain
        run: |
          node .github/scripts/generate-rss.js
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node .github/scripts/send-push.js --deadline-check
          else
            node .github/scripts/send-push.js
          fi

      - name: Commit & Push synchronization updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Detect files in workspace root or events subdirectory
          TRACKER_FILE=""
          FEED_FILE=""
          if [ -f "tracker.json" ]; then
            TRACKER_FILE="tracker.json"
          elif [ -f "events/tracker.json" ]; then
            TRACKER_FILE="events/tracker.json"
          fi

          if [ -f "feed.xml" ]; then
            FEED_FILE="feed.xml"
          elif [ -f "events/feed.xml" ]; then
            FEED_FILE="events/feed.xml"
          fi
          
          if [ -n "$TRACKER_FILE" ]; then
            git add "$TRACKER_FILE"
          fi
          if [ -n "$FEED_FILE" ]; then
            git add "$FEED_FILE"
          fi

          # Commit only if changes exist
          if ! git diff --cached --quiet; then
            git commit -m "chore: update tracking registry states & RSS feed [skip ci]"
            git push
            echo "Changes successfully pushed."
          else
            echo "No changes detected. Skipping commit."
          fi
